<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <!-- Versión lineal sin fondo / Trazo monocromo adaptable al tema -->
  <g transform="translate(4 4)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antena en L con nodo -->
    <path d="M12 8V4H8"/>
    <!-- Cabeza rectangular redondeada -->
    <rect width="16" height="12" x="4" y="8" rx="2.5"/>
    <!-- Orejas laterales -->
    <path d="M2 14h2"/>
    <path d="M20 14h2"/>
    <!-- Ojo izquierdo: '>' -->
    <path d="M8 12.3 L10.8 14 L8 15.7"/>
    <!-- Ojo derecho: '_' (guiño) -->
    <path d="M13.2 15.5 h3.2"/>
  </g>
</svg>