<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- CRT Screen Glow -->
    <radialGradient id="c3-crt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2a1b"/>
      <stop offset="70%" stop-color="#05140b"/>
      <stop offset="100%" stop-color="#020804"/>
    </radialGradient>

    <!-- Phosphor Green Neon -->
    <linearGradient id="c3-green-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aff5b4"/>
      <stop offset="50%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="c3-scanlines" width="100" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="3" opacity="0.45"/>
    </pattern>

    <!-- Bloom Filter -->
    <filter id="c3-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="c3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="80" fill="#0d1117" stroke="#30363d" stroke-width="4"/>

  <!-- Retro Antenna with LED -->
  <g filter="url(#c3-shadow)">
    <line x1="160" y1="120" x2="110" y2="50" stroke="#8b949e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="110" cy="50" r="14" fill="#f85149" filter="url(#c3-bloom)"/>
    <circle cx="110" cy="50" r="5" fill="#ffa198"/>
  </g>

  <!-- CRT Monitor Bezel (Outer Shell) -->
  <rect x="64" y="110" width="384" height="320" rx="40" fill="#21262d" stroke="#30363d" stroke-width="6" filter="url(#c3-shadow)"/>
  <rect x="80" y="126" width="352" height="288" rx="28" fill="#161b22" stroke="#484f58" stroke-width="2"/>

  <!-- Bezel Corner Screws -->
  <circle cx="86" cy="132" r="4" fill="#8b949e"/>
  <circle cx="426" cy="132" r="4" fill="#8b949e"/>
  <circle cx="86" cy="408" r="4" fill="#8b949e"/>
  <circle cx="426" cy="408" r="4" fill="#8b949e"/>

  <!-- CRT Curved Screen Glass -->
  <rect x="100" y="146" width="312" height="248" rx="20" fill="url(#c3-crt-glow)" stroke="#238636" stroke-width="2"/>

  <!-- Scanline Overlay -->
  <rect x="100" y="146" width="312" height="248" rx="20" fill="url(#c3-scanlines)"/>

  <!-- Phosphor Green Terminal Face { > - } -->
  <g filter="url(#c3-bloom)">
    <!-- Left Bracket { -->
    <text x="122" y="295" font-family="'Courier New', monospace" font-size="110" font-weight="900" fill="url(#c3-green-neon)">{</text>

    <!-- Left Eye > -->
    <path d="M 194 235 L 230 262 L 194 289" fill="none" stroke="url(#c3-green-neon)" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter"/>

    <!-- Right Eye - (Wink) -->
    <line x1="282" y1="262" x2="322" y2="262" stroke="url(#c3-green-neon)" stroke-width="12" stroke-linecap="square"/>

    <!-- Right Bracket } -->
    <text x="340" y="295" font-family="'Courier New', monospace" font-size="110" font-weight="900" fill="url(#c3-green-neon)">}</text>

    <!-- Blinking Terminal Prompt Cursor _ -->
    <rect x="242" y="325" width="28" height="6" fill="#7ee787"/>
  </g>

  <!-- Power Status Dot -->
  <circle cx="396" cy="374" r="3" fill="#7ee787" filter="url(#c3-bloom)"/>
</svg>