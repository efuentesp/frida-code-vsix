<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="v2-dark-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="v2-dark-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
  </defs>

  <!-- Fondo Dark con borde degradado -->
  <circle cx="16" cy="16" r="15" fill="url(#v2-dark-bg)" stroke="url(#v2-dark-border)" stroke-width="1.5"/>

  <!-- Robot con acentos cian y violeta neón -->
  <g transform="translate(4 4)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antena en L -->
    <path d="M12 8V4H8" stroke="#58a6ff" stroke-width="2"/>
    <!-- Cabeza rectangular redondeada -->
    <rect width="16" height="12" x="4" y="8" rx="2.5" stroke="#f0f6fc" stroke-width="2"/>
    <!-- Orejas laterales -->
    <path d="M2 14h2" stroke="#58a6ff" stroke-width="2"/>
    <path d="M20 14h2" stroke="#bc8cff" stroke-width="2"/>
    <!-- Ojo izquierdo: '>' en cian neón -->
    <path d="M8 12.3 L10.8 14 L8 15.7" stroke="#58a6ff" stroke-width="2.2"/>
    <!-- Ojo derecho: '_' (guiño) en violeta neón -->
    <path d="M13.2 15.5 h3.2" stroke="#bc8cff" stroke-width="2.2"/>
  </g>
</svg>