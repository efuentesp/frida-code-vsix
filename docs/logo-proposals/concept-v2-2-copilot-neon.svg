<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="v2-copilot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="60%" stop-color="#8250df"/>
      <stop offset="100%" stop-color="#bf3989"/>
    </linearGradient>
    <linearGradient id="v2-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular degradado Copilot -->
  <circle cx="16" cy="16" r="16" fill="url(#v2-copilot-bg)"/>
  
  <!-- Robot con trazo blanco nítido -->
  <g transform="translate(4 4)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antena en L -->
    <path d="M12 8V4H8"/>
    <!-- Cabeza rectangular -->
    <rect width="16" height="12" x="4" y="8" rx="2.5"/>
    <!-- Orejas laterales -->
    <path d="M2 14h2"/>
    <path d="M20 14h2"/>
    <!-- Ojo izquierdo: '>' -->
    <path d="M8 12.2 L10.8 14 L8 15.8"/>
    <!-- Ojo derecho: '_' (guiño) -->
    <path d="M13.2 15.5 h3.2"/>
  </g>

  <!-- Destello sutil de IA ✦ en la esquina del guiño -->
  <circle cx="21.5" cy="16" r="0.9" fill="#79c0ff"/>
</svg>