<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="c4-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#bc8cff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- White / Silver Body Gradient -->
    <linearGradient id="c4-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="80%" stop-color="#c9d1d9"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>

    <!-- Ear Bracket Gradient -->
    <linearGradient id="c4-ear-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>

    <!-- Face Visor Gradient -->
    <linearGradient id="c4-visor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="c4-cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>

    <!-- Coral Blush -->
    <radialGradient id="c4-blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b72" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff7b72" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="c4-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="c4-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="256" cy="256" r="235" fill="url(#c4-bg-glow)"/>

  <!-- Left Ear Antenna (Bracket '{' Shape) -->
  <g filter="url(#c4-shadow)">
    <path d="M 120 150 Q 80 150 80 190 L 80 205 Q 80 225 60 225 Q 80 225 80 245 L 80 260 Q 80 300 120 300" 
          fill="none" stroke="url(#c4-ear-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="120" cy="150" r="10" fill="#58a6ff"/>
    <circle cx="120" cy="300" r="10" fill="#bc8cff"/>
  </g>

  <!-- Right Ear Antenna (Bracket '}' Shape) -->
  <g filter="url(#c4-shadow)">
    <path d="M 392 150 Q 432 150 432 190 L 432 205 Q 432 225 452 225 Q 432 225 432 245 L 432 260 Q 432 300 392 300" 
          fill="none" stroke="url(#c4-ear-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="392" cy="150" r="10" fill="#58a6ff"/>
    <circle cx="392" cy="300" r="10" fill="#bc8cff"/>
  </g>

  <!-- Main Capsule Head (Cute Body) -->
  <rect x="96" y="96" width="320" height="290" rx="100" fill="url(#c4-body)" stroke="#ffffff" stroke-width="3" filter="url(#c4-shadow)"/>

  <!-- Glass Visor Face Screen -->
  <rect x="122" y="126" width="268" height="230" rx="72" fill="url(#c4-visor)" stroke="#30363d" stroke-width="3"/>

  <!-- Glossy Glass Reflection Arc -->
  <path d="M 140 160 Q 256 136 372 160 Q 256 148 140 160 Z" fill="#ffffff" opacity="0.15"/>

  <!-- Face: > - with cute smile and glowing brackets inside -->
  <g filter="url(#c4-glow)">
    <!-- Eye Left: Cheerful Chevron '>' -->
    <path d="M 180 216 L 222 245 L 180 274" 
          fill="none" stroke="url(#c4-cyan-glow)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Eye Right: Cheerful Wink '-' -->
    <path d="M 288 245 L 332 245" 
          fill="none" stroke="url(#c4-cyan-glow)" stroke-width="14" stroke-linecap="round"/>
    <!-- Wink Accent Sparkle -->
    <path d="M 334 228 L 344 238 M 344 228 L 334 238" stroke="#ff7b72" stroke-width="4" stroke-linecap="round"/>

    <!-- Happy Mouth Curve ‿ -->
    <path d="M 234 290 Q 256 312 278 290" 
          fill="none" stroke="#79c0ff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Rosy Cheeks -->
  <circle cx="165" cy="275" r="14" fill="url(#c4-blush)"/>
  <circle cx="347" cy="275" r="14" fill="url(#c4-blush)"/>

  <!-- Floating Ion Jet Base -->
  <g filter="url(#c4-glow)">
    <ellipse cx="256" cy="420" rx="60" ry="10" fill="url(#c4-cyan-glow)" opacity="0.75"/>
    <ellipse cx="256" cy="420" rx="30" ry="5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>